site_name: Huiying Filter Data
site_description: >-
  Canonical product database for huiying — structured SKU records, reference-level
  vehicle fitment framework and filter-media comparison. Machine-readable, zero marketing.
site_url: https://data.carfilterspro.com
repo_url: https://github.com/martinxionbiotech-max/data.huiying
repo_name: data.huiying
copyright: 'Qinghe County Huiying Automotive Parts Co., Ltd. · carfilterspro.com'

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

plugins:
  - search:
      lang: [en]

exclude_docs: |
  build-report.md
  expansion-report.md

extra:
  version: 0.1.0
  main_site: https://carfilterspro.com

